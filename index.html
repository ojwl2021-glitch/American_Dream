<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>좌석 배치 및 실시간 예약</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .flight-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 480px;
        }
        h2 {
            color: #222222;
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #555555;
            padding-bottom: 10px;
        }
        .airplane-body {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 30px 30px 10px 10px;
            border: 2px solid #cccccc;
            max-height: 500px;
            overflow-y: auto;
        }
        .airplane-body::-webkit-scrollbar { width: 8px; }
        .airplane-body::-webkit-scrollbar-thumb {
            background-color: #bbbbbb;
            border-radius: 4px;
        }
        .row {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            align-items: center;
        }
        .row-number {
            width: 30px;
            text-align: center;
            font-weight: bold;
            color: #666666;
        }
        .seat-group {
            display: flex;
            gap: 5px;
        }
        .aisle { width: 25px; }
        .seat {
            width: 42px; 
            height: 30px;
            background-color: #eeeeee;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #aaaaaa;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .seat:hover { background-color: #cccccc; }
        .seat.selected {
            background-color: #222222;
            color: #ffffff;
            border-color: #000000;
            font-weight: bold;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #fdfdfd;
            border: 1px solid #cccccc;
            border-radius: 8px;
            min-height: 60px;
        }
        .result-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #444;
        }
        .passenger-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .passenger-item {
            background-color: #eeeeee;
            padding: 5px 10px;
            border-radius: 15px;
            border: 1px solid #cccccc;
        }
    </style>
</head>
<body>

    <!-- 가는편 -->
    <div class="flight-container">
        <h2>🛫 가는편</h2>
        <div class="airplane-body" id="outbound-seat-map"></div>
        <div class="result-box">
            <div class="result-title">탑승자 명단 (가는편)</div>
            <ul class="passenger-list" id="outbound-list"></ul>
        </div>
    </div>

    <!-- 오는편 -->
    <div class="flight-container">
        <h2>🛬 오는편</h2>
        <div class="airplane-body" id="inbound-seat-map"></div>
        <div class="result-box">
            <div class="result-title">탑승자 명단 (오는편)</div>
            <ul class="passenger-list" id="inbound-list"></ul>
        </div>
    </div>

    <!-- Firebase v10 모듈 스크립트 -->
    <script type="module">
        // 브라우저에서 바로 실행되도록 CDN 링크를 사용합니다.
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteField, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 사용자님이 찾아주신 파이어베이스 설정값 적용 완료
        const firebaseConfig = {
            apiKey: "AIzaSyD-DnZx2OKE83XVHTwfWvM-eNK-gCjkxZk",
            authDomain: "the-american-dream-e7137.firebaseapp.com",
            projectId: "the-american-dream-e7137",
            storageBucket: "the-american-dream-e7137.firebasestorage.app",
            messagingSenderId: "133403559382",
            appId: "1:133403559382:web:3354a680e927770156d077",
            measurementId: "G-C0MCJHLL6P"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 좌석 기본 세팅
        const seatLetters = [['A', 'B', 'C'], ['D', 'E', 'F'], ['G', 'H', 'J']];
        const startRow = 28;
        const endRow = 53;

        // 생성된 DOM 요소를 메모리에 저장하여 빠르게 업데이트하기 위한 객체
        const seatDOMs = { outbound: {}, inbound: {} };

        // 1. 좌석 UI 렌더링 함수
        function renderSeats(containerId, flightType) {
            const container = document.getElementById(containerId);

            for (let row = startRow; row <= endRow; row++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                const rowNum = document.createElement('div');
                rowNum.className = 'row-number';
                rowNum.innerText = row;
                rowDiv.appendChild(rowNum);

                seatLetters.forEach((group, index) => {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'seat-group';

                    group.forEach(letter => {
                        const seat = document.createElement('div');
                        seat.className = 'seat';
                        seat.innerText = letter;
                        seat.dataset.letter = letter; // 초기 알파벳 기억용
                        
                        const seatNumber = row + letter;
                        
                        // DOM 객체에 저장
                        seatDOMs[flightType][seatNumber] = seat;

                        // 클릭 이벤트 (Firebase DB에 데이터 쓰기/삭제)
                        seat.addEventListener('click', async function() {
                            const docRef = doc(db, 'flights', flightType); // flights 컬렉션 하위의 outbound/inbound 문서

                            if (this.classList.contains('selected')) {
                                if (confirm(`[${seatNumber}] 좌석 배정을 취소하시겠습니까?`)) {
                                    // Firebase 문서에서 해당 필드(좌석) 삭제
                                    await updateDoc(docRef, { [seatNumber]: deleteField() }).catch(e => console.log(e));
                                }
                            } else {
                                const passengerName = prompt(`${seatNumber} 좌석에 탑승할 분의 이름을 입력하세요:`);
                                if (passengerName && passengerName.trim() !== "") {
                                    // Firebase 문서에 좌석:이름 병합 저장 (문서가 없으면 자동 생성)
                                    await setDoc(docRef, { [seatNumber]: passengerName.trim() }, { merge: true });
                                }
                            }
                        });

                        groupDiv.appendChild(seat);
                    });
                    rowDiv.appendChild(groupDiv);

                    if (index < seatLetters.length - 1) {
                        const aisle = document.createElement('div');
                        aisle.className = 'aisle';
                        rowDiv.appendChild(aisle);
                    }
                });
                container.appendChild(rowDiv);
            }
        }

        // 2. Firebase 실시간 데이터 동기화 함수
        function syncFirebaseData(flightType, listId) {
            const docRef = doc(db, 'flights', flightType);
            const listContainer = document.getElementById(listId);

            // DB에 변화가 생길 때마다 실행됨 (다른 브라우저에서 입력해도 즉각 반응)
            onSnapshot(docRef, (snapshot) => {
                const data = snapshot.exists() ? snapshot.data() : {};
                listContainer.innerHTML = '';

                // 1) 전체 좌석 상태 초기화
                Object.values(seatDOMs[flightType]).forEach(seat => {
                    seat.classList.remove('selected');
                    seat.innerText = seat.dataset.letter;
                });

                // 2) Firebase 데이터를 바탕으로 선택된 좌석 업데이트
                Object.keys(data).sort().forEach(seatNum => {
                    const name = data[seatNum];
                    const seatDiv = seatDOMs[flightType][seatNum];
                    
                    if (seatDiv) {
                        seatDiv.classList.add('selected');
                        seatDiv.innerText = name;
                    }

                    // 하단 탑승자 명단에 추가
                    const li = document.createElement('li');
                    li.className = 'passenger-item';
                    li.innerText = `${seatNum} : ${name}`;
                    listContainer.appendChild(li);
                });
            });
        }

        // 초기화 실행
        renderSeats('outbound-seat-map', 'outbound');
        renderSeats('inbound-seat-map', 'inbound');

        syncFirebaseData('outbound', 'outbound-list');
        syncFirebaseData('inbound', 'inbound-list');
    </script>
</body>
</html>
